name: Deploy Website v1.8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "filippo-beer-sommelier-site-v1.8-Deployment-Candidate.zip"
      - "filippo-beer-sommelier-site-v1.8-Deployment-Candidate.zip.sha256"
      - ".github/workflows/deploy-ovh.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c filippo-beer-sommelier-site-v1.8-Deployment-Candidate.zip.sha256

      - name: Extract website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          unzip -q filippo-beer-sommelier-site-v1.8-Deployment-Candidate.zip -d site
          test "$(unzip -Z1 filippo-beer-sommelier-site-v1.8-Deployment-Candidate.zip | wc -l)" -eq 71

      - name: Validate Website v1.8 package
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/.htaccess
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/llms.txt
          test -s site/llms-full.txt
          test -s site/viaggi-birrari/index.html
          test -s site/social-publishing-engine/index.html
          test -s site/social-publishing-engine/privacy/index.html
          test -s site/social-publishing-engine/terms/index.html

          grep -Fq '<link href="https://filippobeersommelier.com/" rel="canonical"/>' site/index.html
          grep -Fq '<a href="/viaggi-birrari/">Viaggi</a>' site/index.html
          grep -Fq 'https://filippobeersommelier.com/viaggi-birrari/' site/sitemap.xml
          grep -Fq 'https://filippobeersommelier.com/social-publishing-engine/privacy/' site/sitemap.xml
          grep -Fq 'https://filippobeersommelier.com/social-publishing-engine/terms/' site/sitemap.xml
          grep -Fq 'RewriteRule ^ - [R=503,L]' site/.htaccess
          grep -Fq 'RewriteRule ^ https://filippobeersommelier.com%{REQUEST_URI} [R=301,L,NE]' site/.htaccess

          if grep -R --binary-files=without-match -E 'REPLACE-|codex-preview|trettenerof\.chatgpt\.site|https://filippobeersommelier\.it' site; then
            exit 1
          fi

          EXPECTED='tiktok-developers-site-verification=5rkevnoMGFvYZBBBJScWaqST958gxnDx'
          printf '%s\n' "$EXPECTED" | cmp -s - site/tiktok-developers-site-verification.txt
          printf '%s\n' "$EXPECTED" | cmp -s - site/social-publishing-engine/tiktok-developers-site-verification.txt
          cmp -s site/tiktok-developers-site-verification.txt site/social-publishing-engine/tiktok-developers-site-verification.txt

          test "$(grep -Rl --include='index.html' 'brevo-custom.css' site | wc -l)" -eq 2
          test "$(grep -Rl --include='index.html' 'brevo-config.js' site | wc -l)" -eq 2

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to OVHcloud via SFTP
        shell: bash
        env:
          SFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SFTP_PASSWORD:?Missing OVH_FTP_PASSWORD}"

          lftp -u "filippx","$SFTP_PASSWORD" "sftp://ftp.cluster129.hosting.ovh.net:22" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --verbose --parallel=4 site/ /home/filippx/www/
          bye
          EOF
