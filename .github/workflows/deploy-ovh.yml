name: Deploy MVP v1.7 to OVHcloud

on:
  workflow_dispatch:
    inputs:
      release_zip:
        description: "ZIP path stored in the repository"
        required: true
        default: "release/filippo-beer-sommelier-site-MVP-v1.7-Deployment-Candidate.zip"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ inputs.release_zip }}"
          test -f "$ZIP"
          unzip -t "$ZIP"

      - name: Extract release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir build
          unzip -q "${{ inputs.release_zip }}" -d build
          test -f build/index.html

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to OVHcloud
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.OVH_FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.OVH_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing OVH_FTP_SERVER}"
          : "${FTP_USERNAME:?Missing OVH_FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing OVH_FTP_PASSWORD}"
          PORT="${FTP_PORT:-21}"
          REMOTE_DIR="${FTP_REMOTE_DIR:-/www}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$PORT" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose --parallel=4 build/ "$REMOTE_DIR"/
          bye
          EOF

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## OVHcloud deployment completed"
            echo ""
            echo "Release: \`${{ inputs.release_zip }}\`"
            echo "Remote directory: \`${{ secrets.OVH_FTP_REMOTE_DIR }}\`"
            echo ""
            echo "Run the live smoke test before declaring Production GO."
          } >> "$GITHUB_STEP_SUMMARY"
