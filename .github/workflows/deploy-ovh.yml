name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          unzip -q filippo-beer-sommelier-site-MVP-v1.7-Deployment-Candidate.zip -d site
          test -f site/index.html

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.OVH_FTP_PORT }}
          server-dir: ${{ secrets.OVH_FTP_REMOTE_DIR }}/
          local-dir: site/
