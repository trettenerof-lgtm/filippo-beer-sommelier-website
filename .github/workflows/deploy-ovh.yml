name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          unzip -q filippo-beer-sommelier-site-MVP-v1.7-Deployment-Candidate.zip -d site
          test -f site/index.html

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: filippx
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /www/
          local-dir: site/
