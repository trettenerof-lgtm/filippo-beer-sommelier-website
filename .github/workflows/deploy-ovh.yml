name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          unzip -q filippo-beer-sommelier-site-MVP-v1.7-Deployment-Candidate.zip -d site
          test -f site/index.html

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to OVHcloud via SFTP
        shell: bash
        env:
          SFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SFTP_PASSWORD:?Missing OVH_FTP_PASSWORD}"

          lftp -u "filippx","$SFTP_PASSWORD" "sftp://ftp.cluster129.hosting.ovh.net:22" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --verbose --parallel=4 site/ /home/filippx/www/
          bye
          EOF
